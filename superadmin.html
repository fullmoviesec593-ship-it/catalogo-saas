<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Súper Admin | Control SaaS</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2, h3 { text-align: center; color: #f59e0b; margin-top: 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #22c55e; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #22c55e; color: #000; margin-top: 10px; }
    .btn-primary:active { transform: scale(0.98); }
    .hidden { display: none !important; }
    .revendedor-item { background: #0f172a; padding: 14px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #3b82f6; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #22c55e; color: #000; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-section" class="card">
    <h2>👑 Acceso Dueño</h2>
    <div class="form-group">
      <label>Correo</label>
      <input type="email" id="email" placeholder="admin@fullmovies.ec" value="admin@fullmovies.ec">
    </div>
    <div class="form-group">
      <label>Contraseña Maestra</label>
      <input type="password" id="password" placeholder="Tu contraseña">
    </div>
    <button class="btn-primary" onclick="iniciarSesion()">Acceder al Control</button>
  </div>

  <!-- PANEL DASHBOARD -->
  <div id="dashboard-section" class="card hidden" style="max-width: 750px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h3 style="margin:0;">⚙️ Gestión de Revendedores</h3>
      <button onclick="location.reload()" style="width:auto; padding:6px 12px; background:#ef4444; color:#fff;">Cerrar</button>
    </div>

    <div style="background:#0f172a; padding:16px; border-radius:8px; margin-bottom:24px;">
      <h4 style="margin-top:0; color:#38bdf8;">Registrar Nuevo Revendedor</h4>
      <div class="form-group">
        <label>Nombre de la Tienda / Revendedor</label>
        <input type="text" id="nuevo-nombre" placeholder="Ej: Streaming Loja">
      </div>
      <div class="form-group">
        <label>Identificador Único (Slug - sin espacios ni caracteres raros)</label>
        <input type="text" id="nuevo-slug" placeholder="Ej: loja">
      </div>
      <div class="form-group">
        <label>Correo del Revendedor</label>
        <input type="email" id="nuevo-correo" placeholder="cliente@gmail.com">
      </div>
      <div class="form-group">
        <label>Contraseña para su panel</label>
        <input type="text" id="nueva-clave" placeholder="clave123">
      </div>
      <div class="form-group">
        <label>Días de Suscripción</label>
        <input type="number" id="nuevo-dias" value="30">
      </div>
      <button class="btn-primary" onclick="crearRevendedor()">Crear Cuenta y Activar</button>
    </div>

    <h4>Revendedores Activos</h4>
    <div id="lista-revendedores"></div>
  </div>

  <script>
    let dbData = null;

    async function cargarBD() {
      try {
        const res = await fetch('/api/db');
        dbData = await res.json();
      } catch (e) {
        alert('Error conectando al servidor API: ' + e.message);
      }
    }

    async function iniciarSesion() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!dbData) await cargarBD();

      if (!dbData) {
        alert('No se pudo cargar la base de datos.');
        return;
      }

      const superadmin = dbData.superadmin || {};
      
      // Valida credenciales desde database.json o maestro por defecto
      if ((superadmin.email && email === superadmin.email && pass === superadmin.password) || 
          (email === 'admin@fullmovies.ec' && pass === '12345678') ||
          (email === 'admin@fullmovies.ec' && pass === 'admin123')) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        renderRevendedores();
      } else {
        alert('Credenciales incorrectas. Verifica correo y contraseña.');
      }
    }

    function renderRevendedores() {
      const contenedor = document.getElementById('lista-revendedores');
      contenedor.innerHTML = '';
      const revendedores = dbData.revendedores || {};

      const slugs = Object.keys(revendedores);
      if (slugs.length === 0) {
        contenedor.innerHTML = '<p style="color:#64748b;">No hay revendedores registrados todavía.</p>';
        return;
      }

      slugs.forEach(slug => {
        const r = revendedores[slug];
        const item = document.createElement('div');
        item.className = 'revendedor-item';
        item.innerHTML = `
          <div style="display:flex; justify-content:space-between;">
            <strong>${r.nombre || slug}</strong>
            <span class="badge">${r.activo ? 'ACTIVO' : 'SUSPENDIDO'}</span>
          </div>
          <p style="margin:6px 0; font-size:13px; color:#94a3b8;">
            <b>Slug:</b> ${slug} | <b>Correo:</b> ${r.email} | <b>Clave:</b> ${r.password}
          </p>
          <p style="margin:4px 0; font-size:13px;">
            <b>Link Catálogo:</b> <a href="/?tienda=${slug}" target="_blank" style="color:#38bdf8;">/?tienda=${slug}</a>
          </p>
        `;
        contenedor.appendChild(item);
      });
    }

    async function crearRevendedor() {
      const nombre = document.getElementById('nuevo-nombre').value.trim();
      const slug = document.getElementById('nuevo-slug').value.trim().toLowerCase();
      const email = document.getElementById('nuevo-correo').value.trim();
      const password = document.getElementById('nueva-clave').value.trim();
      const dias = parseInt(document.getElementById('nuevo-dias').value) || 30;

      if (!nombre || !slug || !email || !password) {
        alert('Por favor completa todos los campos.');
        return;
      }

      if (!dbData.revendedores) dbData.revendedores = {};
      if (!dbData.tiendas) dbData.tiendas = {};

      const vencimiento = new Date();
      vencimiento.setDate(vencimiento.getDate() + dias);

      dbData.revendedores[slug] = {
        nombre,
        email,
        password,
        vencimiento: vencimiento.toISOString(),
        activo: true
      };

      if (!dbData.tiendas[slug]) {
        dbData.tiendas[slug] = {
          nombre: nombre,
          whatsapp: "593999999999",
          moneda: "$",
          productos: []
        };
      }

      const res = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dbData)
      });

      if (res.ok) {
        alert('¡Revendedor creado con éxito!');
        renderRevendedores();
        document.getElementById('nuevo-nombre').value = '';
        document.getElementById('nuevo-slug').value = '';
        document.getElementById('nuevo-correo').value = '';
        document.getElementById('nueva-clave').value = '';
      } else {
        alert('Error al guardar datos en el servidor.');
      }
    }

    cargarBD();
  </script>
</body>
</html>
