<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Súper Admin | FULL MOVIES EC</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-green: #22c55e;
      --neon-glow: rgba(34, 197, 94, 0.4);
      --bg-dark: #07090e;
      --card-bg: #0f1626;
      --border-color: #1e293b;
      --cyan-neon: #38bdf8;
      --alert-red: #ef4444;
      --alert-yellow: #eab308;
    }
    * { box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 10%, rgba(34, 197, 94, 0.08) 0%, transparent 60%);
      color: #f1f5f9;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 24px;
      width: 100%;
      max-width: 680px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(34, 197, 94, 0.12);
    }
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-green);
      text-shadow: 0 0 12px var(--neon-glow);
      text-align: center;
      margin: 10px 0 6px 0;
      letter-spacing: 1px;
      font-size: 22px;
    }
    .brand-sub {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 10px auto;
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 16px var(--neon-glow);
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      background-color: #080d1a;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-glow);
    }
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
      transition: 0.2s;
    }
    .btn-neon {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #031e0c;
      box-shadow: 0 0 15px var(--neon-glow);
    }
    .btn-neon:active { transform: scale(0.98); }
    .btn-cyan { background: #0284c7; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .hidden { display: none !important; }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .nav-tab {
      flex: 1;
      padding: 10px 6px;
      text-align: center;
      background: #080d1a;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      color: #94a3b8;
      border: 1px solid transparent;
    }
    .nav-tab.active {
      background: #111d33;
      color: var(--neon-green);
      border-color: var(--neon-green);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.2);
    }
    .user-card {
      background: #080d1a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      border-left: 5px solid var(--neon-green);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      position: relative;
    }
    .user-card.urgente { border-left-color: var(--alert-red); }
    .user-card.aviso { border-left-color: var(--alert-yellow); }
    .user-card.suspendido { border-left-color: #64748b; opacity: 0.8; }

    .tag-countdown {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tag-countdown.red {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
      animation: pulse 1.8s infinite;
    }
    .tag-countdown.yellow {
      background: rgba(234, 179, 8, 0.2);
      color: #facc15;
      border: 1px solid #eab308;
    }
    .tag-countdown.green {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .btn-copy-all {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 10px;
      font-size: 13px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn-copy-all:active {
      background: var(--neon-green);
      color: #000;
      border-color: var(--neon-green);
    }
  </style>
</head>
<body>

  <!-- PANTALLA: LOGIN DUEÑO -->
  <div id="login-section" class="card">
    <img src="https://i.ibb.co/3k5fH4P/logo-fullmovies.jpg" onerror="this.src='https://via.placeholder.com/100/0f1626/22c55e?text=FM'" class="logo-img" alt="Full Movies Ec">
    <h2 class="brand-title">👑 FULL MOVIES EC</h2>
    <div class="brand-sub">SISTEMA DE CONTROL MAESTRO</div>

    <div class="form-group">
      <label>Correo Maestro</label>
      <input type="email" id="email" value="admin@fullmovies.ec">
    </div>
    <div class="form-group">
      <label>Contraseña Maestra</label>
      <input type="password" id="password" placeholder="Ingresa tu clave">
    </div>
    <button class="btn-neon" onclick="iniciarSesion()">ACCEDER AL CONTROL</button>
    <button style="background:transparent; color:#64748b; font-size:14px; margin-top:10px;" onclick="mostrarRecuperacion()">¿Olvidaste tu contraseña?</button>
  </div>

  <!-- PANTALLA: RECUPERAR CONTRASEÑA -->
  <div id="recover-section" class="card hidden">
    <h2 class="brand-title" style="color:#38bdf8;">🔑 RESTABLECER ACCESO</h2>
    <p style="font-size:14px; color:#94a3b8; text-align:center;">Ingresa tu código PIN maestro (por defecto: <b>5930</b>) para cambiar tu clave.</p>
    <div class="form-group">
      <label>PIN Maestro de Seguridad</label>
      <input type="password" id="rec-pin" placeholder="PIN de seguridad">
    </div>
    <div class="form-group">
      <label>Nueva Contraseña Maestra</label>
      <input type="text" id="rec-new-pass" placeholder="Escribe tu nueva clave">
    </div>
    <button class="btn-neon" onclick="reestablecerClave()">RESTABLECER CONTRASEÑA</button>
    <button style="background:#1e293b; color:#fff; margin-top:8px;" onclick="volverAlLogin()">Volver</button>
  </div>

  <!-- PANTALLA: DASHBOARD DUEÑO -->
  <div id="dashboard-section" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #1e293b; padding-bottom:12px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <img src="https://i.ibb.co/3k5fH4P/logo-fullmovies.jpg" onerror="this.src='https://via.placeholder.com/50/0f1626/22c55e?text=FM'" style="width:40px; height:40px; border-radius:50%; border:1px solid var(--neon-green);" alt="Logo">
        <div>
          <span style="font-family:'Orbitron',sans-serif; color:var(--neon-green); font-size:15px; font-weight:bold;">FULL MOVIES EC</span>
          <div style="font-size:11px; color:#64748b;">Panel Súper Administrador</div>
        </div>
      </div>
      <button onclick="location.reload()" style="width:auto; padding:6px 12px; background:#dc2626; color:#fff; font-size:12px;">Cerrar</button>
    </div>

    <!-- Pestañas -->
    <div class="nav-tabs">
      <div id="tab-btn-users" class="nav-tab active" onclick="cambiarTab('users')">👥 REVENDEDORES</div>
      <div id="tab-btn-create" class="nav-tab" onclick="cambiarTab('create')">➕ REGISTRAR</div>
      <div id="tab-btn-security" class="nav-tab" onclick="cambiarTab('security')">🔒 MI CLAVE</div>
    </div>

    <!-- LISTA DE USUARIOS -->
    <div id="tab-users">
      <div id="lista-revendedores"></div>
    </div>

    <!-- REGISTRO MANUAL DE USUARIOS -->
    <div id="tab-create" class="hidden">
      <div style="background:#080d1a; padding:16px; border-radius:12px; border:1px solid #1e293b;">
        <h4 style="color:var(--neon-green); font-family:'Orbitron'; margin-top:0; font-size:16px;">Alta Manual de Cuenta</h4>
        
        <div class="form-group">
          <label>Modalidad de Cuenta</label>
          <select id="reg-tipo" onchange="ajustarTipoRegistro()">
            <option value="oficial">Revendedor Oficial (Mensual 30 Días)</option>
            <option value="demo">Demo de Prueba (Gratuito 2 Días)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nombre del Revendedor / Negocio</label>
          <input type="text" id="reg-nombre" placeholder="Ej: Streaming Loja">
        </div>
        <div class="form-group">
          <label>Identificador Único (Slug de su catálogo)</label>
          <input type="text" id="reg-slug" placeholder="Ej: loja">
        </div>
        <div class="form-group">
          <label>Correo Electrónico (Usuario de Acceso)</label>
          <input type="email" id="reg-email" placeholder="cliente@gmail.com">
        </div>
        <div class="form-group">
          <label>Contraseña Asignada</label>
          <input type="text" id="reg-pass" placeholder="Ej: acceso123">
        </div>
        <div class="form-group">
          <label id="lbl-dias">Días de Acceso (Calendario)</label>
          <input type="number" id="reg-dias" value="30">
        </div>

        <button class="btn-neon" onclick="guardarNuevoUsuario()">REGISTRAR Y GENERAR ACCESOS</button>
      </div>
    </div>

    <!-- CAMBIO DE CLAVE DUEÑO -->
    <div id="tab-security" class="hidden">
      <div style="background:#080d1a; padding:16px; border-radius:12px; border:1px solid #1e293b;">
        <h4 style="color:var(--cyan-neon); font-family:'Orbitron'; margin-top:0;">Seguridad del Súper Dueño</h4>
        <div class="form-group">
          <label>Correo Electrónico Maestro</label>
          <input type="email" id="cfg-email" value="admin@fullmovies.ec">
        </div>
        <div class="form-group">
          <label>Nueva Contraseña Maestra</label>
          <input type="text" id="cfg-pass" placeholder="Ingresa tu nueva contraseña">
        </div>
        <div class="form-group">
          <label>PIN Maestro de Emergencia</label>
          <input type="text" id="cfg-pin" placeholder="5930">
        </div>
        <button class="btn-cyan" onclick="actualizarCredencialesMaster()">GUARDAR NUEVAS CREDENCIALES</button>
      </div>
    </div>

    <!-- MODAL EDITAR USUARIO -->
    <div id="modal-edit" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; padding:16px; z-index:9999;">
      <div class="card" style="max-width:480px; background:#0f1626;">
        <h3 style="color:var(--neon-green); font-family:'Orbitron'; margin-top:0;">Editar Revendedor</h3>
        <input type="hidden" id="edit-slug">
        <div class="form-group">
          <label>Nombre de Tienda</label>
          <input type="text" id="edit-nombre">
        </div>
        <div class="form-group">
          <label>Correo de Acceso</label>
          <input type="email" id="edit-email">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="text" id="edit-pass">
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="edit-estado">
            <option value="true">Activo (Habilitado)</option>
            <option value="false">Suspendido (Bloqueado)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Renovar días a partir de hoy (Calendario)</label>
          <input type="number" id="edit-dias" value="30">
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-neon" onclick="guardarEdicion()">Guardar</button>
          <button class="btn-danger" style="width:110px;" onclick="cerrarModalEdit()">Cancelar</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let dbData = null;
    const PIN_DEFAULT = "5930";

    async function cargarBD() {
      try {
        const res = await fetch('/api/db');
        dbData = await res.json();
        if (!dbData.superadmin) dbData.superadmin = {};
        if (!dbData.superadmin.pin) dbData.superadmin.pin = PIN_DEFAULT;
      } catch (e) {
        alert('Error conectando a la API: ' + e.message);
      }
    }

    async function iniciarSesion() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!dbData) await cargarBD();

      const sa = dbData.superadmin || {};
      const esCorrecto = (sa.email && email === sa.email && pass === sa.password) ||
                         (email === 'admin@fullmovies.ec' && (pass === 'admin123' || pass === '12345678'));

      if (esCorrecto) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('cfg-email').value = sa.email || 'admin@fullmovies.ec';
        document.getElementById('cfg-pass').value = sa.password || 'admin123';
        document.getElementById('cfg-pin').value = sa.pin || PIN_DEFAULT;
        renderRevendedores();
      } else {
        alert('Contraseña o correo incorrectos.');
      }
    }

    function mostrarRecuperacion() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('recover-section').classList.remove('hidden');
    }

    function volverAlLogin() {
      document.getElementById('recover-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }

    async function reestablecerClave() {
      const pin = document.getElementById('rec-pin').value.trim();
      const nuevaClave = document.getElementById('rec-new-pass').value.trim();

      if (!pin || !nuevaClave) {
        alert('Por favor completa todos los campos.');
        return;
      }

      if (!dbData) await cargarBD();
      const pinValido = (dbData.superadmin && dbData.superadmin.pin) ? dbData.superadmin.pin : PIN_DEFAULT;

      if (pin === pinValido) {
        dbData.superadmin.password = nuevaClave;
        await persistir();
        alert('¡Contraseña reestablecida correctamente! Ya puedes ingresar.');
        document.getElementById('password').value = nuevaClave;
        volverAlLogin();
      } else {
        alert('El PIN maestro ingresado es incorrecto.');
      }
    }

    function cambiarTab(tab) {
      document.getElementById('tab-users').classList.add('hidden');
      document.getElementById('tab-create').classList.add('hidden');
      document.getElementById('tab-security').classList.add('hidden');

      document.getElementById('tab-btn-users').classList.remove('active');
      document.getElementById('tab-btn-create').classList.remove('active');
      document.getElementById('tab-btn-security').classList.remove('active');

      if (tab === 'users') {
        document.getElementById('tab-users').classList.remove('hidden');
        document.getElementById('tab-btn-users').classList.add('active');
        renderRevendedores();
      } else if (tab === 'create') {
        document.getElementById('tab-create').classList.remove('hidden');
        document.getElementById('tab-btn-create').classList.add('active');
      } else if (tab === 'security') {
        document.getElementById('tab-security').classList.remove('hidden');
        document.getElementById('tab-btn-security').classList.add('active');
      }
    }

    function ajustarTipoRegistro() {
      const tipo = document.getElementById('reg-tipo').value;
      if (tipo === 'demo') {
        document.getElementById('reg-dias').value = 2;
        document.getElementById('lbl-dias').innerText = 'Días de Prueba (Demo)';
      } else {
        document.getElementById('reg-dias').value = 30;
        document.getElementById('lbl-dias').innerText = 'Días de Suscripción (Calendario)';
      }
    }

    // Calcula los días restantes exactos
    function calcularDiasRestantes(fechaVencimiento) {
      if (!fechaVencimiento) return 999;
      const ahora = new Date();
      const vence = new Date(fechaVencimiento);
      const diffMs = vence.getTime() - ahora.getTime();
      return Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    }

    function formatearFecha(fechaStr) {
      if (!fechaStr) return 'N/A';
      const f = new Date(fechaStr);
      const opciones = { day: '2-digit', month: '2-digit', year: 'numeric' };
      return f.toLocaleDateString('es-EC', opciones);
    }

    function renderRevendedores() {
      const lista = document.getElementById('lista-revendedores');
      lista.innerHTML = '';

      const revendedores = dbData.revendedores || {};
      const slugs = Object.keys(revendedores);

      if (slugs.length === 0) {
        lista.innerHTML = '<p style="color:#64748b; font-size:15px; text-align:center; padding:20px;">No hay revendedores registrados todavía.</p>';
        return;
      }

      // Ordenar por días restantes (los más próximos a vencer o vencidos van primero)
      const listaOrdenada = slugs.map(slug => {
        const r = revendedores[slug];
        const dias = calcularDiasRestantes(r.vencimiento);
        return { slug, ...r, diasRestantes: dias };
      }).sort((a, b) => a.diasRestantes - b.diasRestantes);

      listaOrdenada.forEach(item => {
        const isDemo = item.isDemo || false;
        const isActive = item.activo !== false;
        const dias = item.diasRestantes;

        let claseCard = '';
        let claseBadge = 'green';
        let textoDias = `${dias} DÍAS RESTANTES`;

        if (!isActive) {
          claseCard = 'suspendido';
          claseBadge = 'red';
          textoDias = 'SUSPENDIDO';
        } else if (dias <= 0) {
          claseCard = 'urgente';
          claseBadge = 'red';
          textoDias = dias === 0 ? 'VENCE HOY' : `VENCIDO (${Math.abs(dias)}d)`;
        } else if (dias <= 3) {
          claseCard = 'urgente';
          claseBadge = 'red';
          textoDias = `⚠️ ${dias} ${dias === 1 ? 'DÍA' : 'DÍAS'} RESTANTES`;
        } else if (dias <= 7) {
          claseCard = 'aviso';
          claseBadge = 'yellow';
          textoDias = `⏳ ${dias} DÍAS RESTANTES`;
        }

        const fechaInicio = formatearFecha(item.fechaCreacion);
        const fechaVence = formatearFecha(item.vencimiento);

        const card = document.createElement('div');
        card.className = `user-card ${claseCard}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong style="font-size:17px; color:#fff; font-family:'Orbitron';">${item.nombre || item.slug}</strong>
              ${isDemo ? '<span style="font-size:11px; background:#a855f7; color:#fff; padding:2px 6px; border-radius:4px; margin-left:6px; font-weight:bold;">DEMO</span>' : ''}
            </div>
            <!-- INDICADOR DE DÍAS RESTANTES -->
            <span class="tag-countdown ${claseBadge}">${textoDias}</span>
          </div>

          <div style="margin:10px 0; font-size:14px; color:#94a3b8; line-height:1.5;">
            <div>👤 <b>Usuario/Correo:</b> <span style="color:#fff;">${item.email}</span></div>
            <div>🔑 <b>Contraseña:</b> <span style="color:var(--neon-green); font-weight:bold;">${item.password}</span></div>
            <div>📅 <b>Inicio:</b> ${fechaInicio} | ⏳ <b>Vence:</b> <span style="color:#f8fafc; font-weight:bold;">${fechaVence}</span></div>
          </div>

          <!-- BOTÓN ÚNICO COPIAR FICHA WHATSAPP -->
          <button class="btn-copy-all" onclick="copiarFichaRevendedor('${item.slug}')">
            📋 COPIAR DATOS DE ACCESO PARA WHATSAPP
          </button>

          <div style="display:flex; gap:8px; margin-top:10px;">
            <button style="background:#1e293b; color:#38bdf8; padding:8px; font-size:13px; border:1px solid #334155;" onclick="abrirModalEdit('${item.slug}')">✏️ Editar / Renovar</button>
            <button style="background:#dc2626; color:#fff; padding:8px; font-size:13px; width:110px;" onclick="eliminarRevendedor('${item.slug}')">🗑️ Eliminar</button>
          </div>
        `;
        lista.appendChild(card);
      });
    }

    function copiarFichaRevendedor(slug) {
      const r = dbData.revendedores[slug];
      const host = window.location.origin;
      const linkAdmin = `${host}/admin.html`;
      const linkCatalogo = `${host}/?tienda=${slug}`;
      const fInicio = formatearFecha(r.fechaCreacion);
      const fVence = formatearFecha(r.vencimiento);

      const textoWhatsapp = 
`🎬 *¡BIENVENIDO A TU PANEL DE CATÁLOGO VIRTUAL!* 🎬
*FULL MOVIES EC*

Hola *${r.nombre || slug}*, tus accesos han sido activados exitosamente:

🔐 *PANEL DE ADMINISTRACIÓN (Tus productos y precios):*
👉 ${linkAdmin}

👤 *Usuario / Correo:* ${r.email}
🔑 *Contraseña:* ${r.password}

📅 *Fecha de Activación:* ${fInicio}
⏳ *Fecha de Vencimiento:* ${fVence}

⚠️ *IMPORTANTE:* Tu servicio vence el día *${fVence}*. Para renovar tu suscripción sin interrupciones, por favor realizar el pago 1 día antes de la fecha de vencimiento.

🌐 *TU CATÁLOGO PÚBLICO (Para tus clientes):*
👉 ${linkCatalogo}

_Ingresa a tu panel para configurar tu número de WhatsApp y tus precios. ¡Éxitos en tus ventas!_`;

      navigator.clipboard.writeText(textoWhatsapp).then(() => {
        alert('¡Datos completos de ' + (r.nombre || slug) + ' copiados!\nListo para enviar por WhatsApp.');
      }).catch(() => {
        prompt('Copia manualmente los datos de acceso:', textoWhatsapp);
      });
    }

    async function guardarNuevoUsuario() {
      const tipo = document.getElementById('reg-tipo').value;
      const nombre = document.getElementById('reg-nombre').value.trim();
      const slug = document.getElementById('reg-slug').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-pass').value.trim();
      const dias = parseInt(document.getElementById('reg-dias').value) || (tipo === 'demo' ? 2 : 30);

      if (!nombre || !slug || !email || !password) {
        alert('Por favor completa todos los campos.');
        return;
      }

      if (!dbData.revendedores) dbData.revendedores = {};
      if (!dbData.tiendas) dbData.tiendas = {};

      const ahora = new Date();
      const vencimiento = new Date();
      vencimiento.setDate(vencimiento.getDate() + dias);

      dbData.revendedores[slug] = {
        nombre,
        email,
        password,
        fechaCreacion: ahora.toISOString(),
        vencimiento: vencimiento.toISOString(),
        activo: true,
        isDemo: (tipo === 'demo')
      };

      if (!dbData.tiendas[slug]) {
        dbData.tiendas[slug] = {
          nombre: nombre,
          whatsapp: "593999999999",
          productos: []
        };
      }

      await persistir();
      alert('¡Cuenta registrada exitosamente!');
      document.getElementById('reg-nombre').value = '';
      document.getElementById('reg-slug').value = '';
      document.getElementById('reg-email').value = '';
      document.getElementById('reg-pass').value = '';
      cambiarTab('users');
    }

    function abrirModalEdit(slug) {
      const r = dbData.revendedores[slug];
      document.getElementById('edit-slug').value = slug;
      document.getElementById('edit-nombre').value = r.nombre || '';
      document.getElementById('edit-email').value = r.email || '';
      document.getElementById('edit-pass').value = r.password || '';
      document.getElementById('edit-estado').value = (r.activo !== false) ? 'true' : 'false';
      document.getElementById('edit-dias').value = 30;
      document.getElementById('modal-edit').classList.remove('hidden');
    }

    function cerrarModalEdit() {
      document.getElementById('modal-edit').classList.add('hidden');
    }

    async function guardarEdicion() {
      const slug = document.getElementById('edit-slug').value;
      const nombre = document.getElementById('edit-nombre').value.trim();
      const email = document.getElementById('edit-email').value.trim();
      const pass = document.getElementById('edit-pass').value.trim();
      const activo = document.getElementById('edit-estado').value === 'true';
      const dias = parseInt(document.getElementById('edit-dias').value) || 0;

      if (!nombre || !email || !pass) {
        alert('Completa los campos.');
        return;
      }

      dbData.revendedores[slug].nombre = nombre;
      dbData.revendedores[slug].email = email;
      dbData.revendedores[slug].password = pass;
      dbData.revendedores[slug].activo = activo;

      if (dias > 0) {
        const hoy = new Date();
        hoy.setDate(hoy.getDate() + dias);
        dbData.revendedores[slug].vencimiento = hoy.toISOString();
      }

      if (dbData.tiendas && dbData.tiendas[slug]) {
        dbData.tiendas[slug].nombre = nombre;
      }

      await persistir();
      alert('¡Datos y vigencia actualizados!');
      cerrarModalEdit();
      renderRevendedores();
    }

    async function eliminarRevendedor(slug) {
      if (confirm(`¿Seguro que deseas eliminar definitivamente a "${slug}"?`)) {
        delete dbData.revendedores[slug];
        if (dbData.tiendas) delete dbData.tiendas[slug];
        await persistir();
        renderRevendedores();
      }
    }

    async function actualizarCredencialesMaster() {
      const nuevoEmail = document.getElementById('cfg-email').value.trim();
      const nuevaPass = document.getElementById('cfg-pass').value.trim();
      const nuevoPin = document.getElementById('cfg-pin').value.trim();

      if (!nuevoEmail || !nuevaPass) {
        alert('Correo y contraseña no pueden estar vacíos.');
        return;
      }

      if (!dbData.superadmin) dbData.superadmin = {};
      dbData.superadmin.email = nuevoEmail;
      dbData.superadmin.password = nuevaPass;
      dbData.superadmin.pin = nuevoPin || PIN_DEFAULT;

      await persistir();
      alert('¡Credenciales actualizadas exitosamente!');
    }

    async function persistir() {
      await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dbData)
      });
    }

    cargarBD();
  </script>
</body>
