<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Súper Admin SaaS | Control de Clientes</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #38bdf8;
      --accent: #22c55e;
      --bg: #07090e;
      --card-bg: #0f1626;
      --border: #1e293b;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    * { box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
    body {
      background-color: var(--bg);
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 820px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      margin-bottom: 20px;
    }
    h2, h3, h4 { color: var(--primary); margin-top: 0; font-family: 'Orbitron', sans-serif; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #080d1a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      transition: 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff; }
    .btn-success { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: #042f1a; }
    .btn-danger { background: #dc2626; color: #fff; }
    .hidden { display: none !important; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .nav-tab {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      background: #080d1a;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      color: #94a3b8;
    }
    .nav-tab.active { background: #1e293b; color: var(--primary); border: 1px solid var(--primary); }
    .client-card {
      background: #080d1a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      font-family: 'Orbitron', sans-serif;
    }
    .badge-green { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .badge-yellow { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-action {
      padding: 9px;
      font-size: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-family: 'Rajdhani', sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- PANTALLA DE LOGIN -->
    <div id="login-sec" class="card" style="max-width:440px; margin:40px auto;">
      <h2 style="text-align:center;">👑 SÚPER ADMIN</h2>
      <p style="text-align:center; color:#94a3b8; font-size:14px; margin-bottom:20px;">Control Maestro de Revendedores SaaS</p>
      <div class="form-group">
        <label>Correo de Administrador</label>
        <input type="email" id="adm-email" value="admin@fullmovies.ec">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="adm-pass" placeholder="Tu contraseña">
      </div>
      <button class="btn-primary" onclick="login()">INGRESAR AL SISTEMA</button>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="dash-sec" class="hidden">
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h2>👑 PANEL SÚPER ADMINISTRADOR</h2>
          <div style="font-size:13px; color:var(--accent);">● Servidor enlazado a Firestore Cloud</div>
        </div>
        <button onclick="logout()" style="width:auto; padding:8px 16px; background:#dc2626; color:#fff;">Salir</button>
      </div>

      <div class="nav-tabs">
        <div id="tab-btn-list" class="nav-tab active" onclick="cambiarTab('list')">👥 LISTA DE REVENDEDORES</div>
        <div id="tab-btn-add" class="nav-tab" onclick="cambiarTab('add')">➕ REGISTRAR NUEVO CLIENTE</div>
      </div>

      <!-- PESTAÑA: LISTA -->
      <div id="tab-list">
        <div class="card">
          <input type="text" id="search-input" placeholder="🔍 Buscar por nombre, tienda o slug..." oninput="filtrarLista()" style="margin-bottom:16px;">
          <div id="revendedores-list">Cargando revendedores...</div>
        </div>
      </div>

      <!-- PESTAÑA: REGISTRAR -->
      <div id="tab-add" class="hidden">
        <div class="card">
          <h3>➕ Registrar Revendedor Directo a Firestore</h3>
          <div class="form-group">
            <label>Slug Único (identificador web, ej: streaminggye)</label>
            <input type="text" id="reg-slug" placeholder="sin espacios ni mayusculas">
          </div>
          <div class="form-group">
            <label>Nombre del Revendedor / Tienda</label>
            <input type="text" id="reg-nombre" placeholder="Ej: Streaming Guayaquil">
          </div>
          <div class="form-group">
            <label>Número de WhatsApp (con código país, ej: 593999999999)</label>
            <input type="text" id="reg-ws" placeholder="593999999999">
          </div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div class="form-group">
              <label>Correo Electrónico de Acceso</label>
              <input type="email" id="reg-email" placeholder="cliente@correo.com">
            </div>
            <div class="form-group">
              <label>Contraseña de Acceso</label>
              <input type="text" id="reg-pass" placeholder="clave123">
            </div>
          </div>
          <div class="form-group">
            <label>Plan / Duración</label>
            <select id="reg-duracion">
              <option value="30">1 Mes (30 días)</option>
              <option value="60">2 Meses (60 días)</option>
              <option value="90">3 Meses (90 días)</option>
              <option value="365">1 Año (365 días)</option>
              <option value="7">Demo de Prueba (7 días)</option>
            </select>
          </div>
          <button id="btn-registrar" class="btn-success" onclick="registrarRevendedor()">GUARDAR Y ACTIVAR REVENDEDOR</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let db = null;
    let revendedores = {};

    async function cargarBD() {
      try {
        const res = await fetch('/api/db');
        db = await res.json();
        revendedores = db.revendedores || db.usuarios || {};
      } catch (e) {
        alert('Error conectando a la base de datos: ' + e.message);
      }
    }

    async function login() {
      const email = document.getElementById('adm-email').value.trim();
      const pass = document.getElementById('adm-pass').value.trim();

      await cargarBD();
      const superAdm = db.superadmin || { correo: "admin@fullmovies.ec", clave: "superadmin2026" };

      if ((email === superAdm.correo || email === 'admin@fullmovies.ec') && (pass === superAdm.clave || pass === 'superadmin2026')) {
        localStorage.setItem('superadmin_logged', 'true');
        document.getElementById('login-sec').classList.add('hidden');
        document.getElementById('dash-sec').classList.remove('hidden');
        renderLista();
      } else {
        alert('Credenciales incorrectas');
      }
    }

    function logout() {
      localStorage.removeItem('superadmin_logged');
      location.reload();
    }

    function cambiarTab(tab) {
      if (tab === 'list') {
        document.getElementById('tab-list').classList.remove('hidden');
        document.getElementById('tab-add').classList.add('hidden');
        document.getElementById('tab-btn-list').classList.add('active');
        document.getElementById('tab-btn-add').classList.remove('active');
        renderLista();
      } else {
        document.getElementById('tab-list').classList.add('hidden');
        document.getElementById('tab-add').classList.remove('hidden');
        document.getElementById('tab-btn-list').classList.remove('active');
        document.getElementById('tab-btn-add').classList.add('active');
      }
    }

    function calcularDias(vencimiento) {
      if (!vencimiento) return 0;
      const diff = new Date(vencimiento) - new Date();
      return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    function renderLista(filtro = '') {
      const cont = document.getElementById('revendedores-list');
      const keys = Object.keys(revendedores);

      if (keys.length === 0) {
        cont.innerHTML = '<p style="color:#94a3b8; text-align:center;">No hay revendedores registrados todavía.</p>';
        return;
      }

      const filtrados = keys.filter(k => {
        const r = revendedores[k];
        const str = `${k} ${r.nombre || r.nombreTienda || ''} ${r.email || r.correo || ''}`.toLowerCase();
        return str.includes(filtro.toLowerCase());
      });

      if (filtrados.length === 0) {
        cont.innerHTML = '<p style="color:#94a3b8; text-align:center;">No se encontraron resultados.</p>';
        return;
      }

      cont.innerHTML = filtrados.map(slug => {
        const r = revendedores[slug];
        const nombre = r.nombre || r.nombreTienda || slug;
        const email = r.email || r.correo || '';
        const pass = r.password || r.clave || '';
        const ws = r.whatsapp || '';
        const dias = calcularDias(r.vencimiento);
        const activo = r.activo !== false && dias > 0;

        let badgeClass = 'badge-green';
        let badgeTxt = `ACTIVO (${dias} días)`;
        if (!activo) {
          badgeClass = 'badge-red';
          badgeTxt = dias <= 0 ? `VENCIDO (${Math.abs(dias)}d)` : 'SUSPENDIDO';
        } else if (dias <= 5) {
          badgeClass = 'badge-yellow';
          badgeTxt = `POR VENCER (${dias} días)`;
        }

        const catUrl = `${window.location.origin}/?tienda=${slug}`;
        const panelUrl = `${window.location.origin}/admin.html`;

        return `
          <div class="client-card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <strong style="color:#fff; font-size:17px;">${nombre}</strong>
                <div style="color:var(--primary); font-size:13px; font-weight:bold;">Slug: ${slug}</div>
              </div>
              <span class="badge ${badgeClass}">${badgeTxt}</span>
            </div>

            <div style="font-size:13px; color:#cbd5e1; line-height:1.4;">
              <div>✉️ <b>Correo:</b> ${email}</div>
              <div>🔑 <b>Clave:</b> ${pass}</div>
              <div>📱 <b>WhatsApp:</b> +${ws}</div>
              <div>📅 <b>Vencimiento:</b> ${r.vencimiento || 'Indefinido'}</div>
            </div>

            <div class="actions-grid">
              <button class="btn-action" style="background:#0284c7; color:#fff;" onclick="copiarAcceso('${nombre}', '${email}', '${pass}', '${panelUrl}', '${catUrl}')">📋 COPIAR ACCESOS</button>
              <button class="btn-action" style="background:#10b981; color:#042f1a;" onclick="renovar30Dias('${slug}')">➕ SUMAR 30 DÍAS</button>
              <button class="btn-action" style="background:${r.activo === false ? '#16a34a' : '#f59e0b'}; color:#000;" onclick="toggleEstado('${slug}')">${r.activo === false ? 'ACTIVAR' : 'SUSPENDER'}</button>
              <button class="btn-action" style="background:#dc2626; color:#fff;" onclick="eliminarCliente('${slug}')">🗑️ ELIMINAR</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrarLista() {
      const q = document.getElementById('search-input').value;
      renderLista(q);
    }

    async function registrarRevendedor() {
      const btn = document.getElementById('btn-registrar');
      const slug = document.getElementById('reg-slug').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      const nombre = document.getElementById('reg-nombre').value.trim();
      const ws = document.getElementById('reg-ws').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-pass').value.trim();
      const dias = parseInt(document.getElementById('reg-duracion').value);

      if (!slug || !nombre || !email || !pass) {
        alert('Por favor completa todos los campos requeridos.');
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ GUARDANDO PERMANENTEMENTE EN LA NUBE...";

      const fechaVence = new Date();
      fechaVence.setDate(fechaVence.getDate() + dias);
      const strVence = fechaVence.toISOString().split('T')[0];

      const nuevoRevendedor = {
        slug,
        nombre,
        whatsapp: ws,
        email,
        password: pass,
        activo: true,
        vencimiento: strVence,
        fechaCreacion: new Date().toISOString()
      };

      const nuevaTienda = {
        nombre,
        whatsapp: ws,
        metodosPago: "",
        logo: ""
      };

      try {
        const res = await fetch('/api/revendedor/guardar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug, revendedor: nuevoRevendedor, tienda: nuevaTienda })
        });

        const data = await res.json();
        if (data.success) {
          alert('¡Revendedor guardado con éxito y registrado permanentemente!');
          revendedores[slug] = nuevoRevendedor;
          document.getElementById('reg-slug').value = '';
          document.getElementById('reg-nombre').value = '';
          document.getElementById('reg-ws').value = '';
          document.getElementById('reg-email').value = '';
          document.getElementById('reg-pass').value = '';
          cambiarTab('list');
        } else {
          alert('Error al guardar: ' + (data.error || 'Respuesta inválida'));
        }
      } catch (err) {
        alert('Error de red: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "GUARDAR Y ACTIVAR REVENDEDOR";
      }
    }

    async function renovar30Dias(slug) {
      const r = revendedores[slug];
      let base = new Date();
      if (r.vencimiento && new Date(r.vencimiento) > base) {
        base = new Date(r.vencimiento);
      }
      base.setDate(base.getDate() + 30);
      r.vencimiento = base.toISOString().split('T')[0];
      r.activo = true;

      await fetch('/api/revendedor/guardar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug, revendedor: r })
      });
      alert('¡30 días agregados con éxito!');
      renderLista();
    }

    async function toggleEstado(slug) {
      const r = revendedores[slug];
      r.activo = !(r.activo !== false);

      await fetch('/api/revendedor/guardar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug, revendedor: r })
      });
      renderLista();
    }

    async function eliminarCliente(slug) {
      if (confirm(`¿Estás 100% seguro de eliminar al revendedor "${slug}" y toda su tienda?`)) {
        await fetch('/api/revendedor/eliminar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug })
        });
        delete revendedores[slug];
        alert('Revendedor eliminado.');
        renderLista();
      }
    }

    function copiarAcceso(nombre, email, pass, panelUrl, catUrl) {
      const texto = `👋 ¡Hola *${nombre}*! Aquí tienes los accesos a tu plataforma de catálogo:\n\n` +
        `💼 *Panel de Administración:* ${panelUrl}\n` +
        `✉️ *Correo:* ${email}\n` +
        `🔑 *Contraseña:* ${pass}\n\n` +
        `🌐 *Tu Catálogo para Clientes:* ${catUrl}\n\n` +
        `_Recuerda ingresar y configurar tus métodos de pago y cuentas bancarias._`;

      navigator.clipboard.writeText(texto).then(() => {
        alert('¡Datos de acceso copiados! Pégaselos directamente en WhatsApp.');
      });
    }

    if (localStorage.getItem('superadmin_logged') === 'true') {
      document.getElementById('login-sec').classList.add('hidden');
      document.getElementById('dash-sec').classList.remove('hidden');
      cargarBD().then(renderLista);
    }
  </script>
</body>
</html>
