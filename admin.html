<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Revendedor | Catálogo</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2, h3 { text-align: center; color: #38bdf8; margin-top: 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #38bdf8; color: #000; margin-top: 10px; }
    .btn-success { background-color: #22c55e; color: #000; margin-top: 10px; }
    .hidden { display: none !important; }
    .producto-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #22c55e; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <!-- LOGIN REVENDEDOR -->
  <div id="login-section" class="card">
    <h2>💼 Acceso Revendedor</h2>
    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" id="email" placeholder="admin@fullmovies.ec" value="admin@fullmovies.ec">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="Tu contraseña">
    </div>
    <button class="btn-primary" onclick="iniciarSesion()">Ingresar a mi Panel</button>
  </div>

  <!-- PANEL DASHBOARD REVENDEDOR -->
  <div id="dashboard-section" class="card hidden" style="max-width: 650px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h3 style="margin:0;" id="titulo-tienda">Mi Tienda</h3>
      <button onclick="location.reload()" style="width:auto; padding:6px 12px; background:#ef4444; color:#fff;">Salir</button>
    </div>

    <!-- Ajustes Tienda -->
    <div style="background:#0f172a; padding:16px; border-radius:8px; margin-bottom:20px;">
      <h4 style="margin-top:0; color:#38bdf8;">Configuración de Tienda</h4>
      <div class="form-group">
        <label>Nombre Comercial</label>
        <input type="text" id="conf-nombre">
      </div>
      <div class="form-group">
        <label>WhatsApp de Ventas (con código país, ej: 593999999999)</label>
        <input type="text" id="conf-whatsapp">
      </div>
      <button class="btn-primary" onclick="guardarAjustes()">Guardar Datos de Tienda</button>
      <p style="margin-top:12px; font-size:14px;">
        <b>Enlace público para tus clientes:</b><br>
        <a id="link-publico" href="#" target="_blank" style="color:#22c55e; word-break:break-all;"></a>
      </p>
    </div>

    <!-- Gestión Productos -->
    <div style="background:#0f172a; padding:16px; border-radius:8px;">
      <h4 style="margin-top:0; color:#22c55e;">Agregar Producto / Servicio</h4>
      <div class="form-group">
        <label>Nombre del Producto</label>
        <input type="text" id="prod-nombre" placeholder="Ej: Netflix 1 Pantalla">
      </div>
      <div class="form-group">
        <label>Precio</label>
        <input type="text" id="prod-precio" placeholder="Ej: 3.50">
      </div>
      <div class="form-group">
        <label>Descripción corta</label>
        <input type="text" id="prod-desc" placeholder="Ej: Cuenta completa garantizada">
      </div>
      <button class="btn-success" onclick="agregarProducto()">Agregar Producto al Catálogo</button>

      <h4 style="margin-top:20px;">Productos en Catálogo</h4>
      <div id="lista-productos"></div>
    </div>
  </div>

  <script>
    let dbData = null;
    let revendedorActual = null;
    let slugActual = null;

    async function cargarBD() {
      try {
        const res = await fetch('/api/db');
        dbData = await res.json();
      } catch (e) {
        alert('Error conectando al servidor: ' + e.message);
      }
    }

    async function iniciarSesion() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!dbData) await cargarBD();

      if (!dbData || !dbData.revendedores) {
        alert('No se pudo leer la base de datos.');
        return;
      }

      // Buscar revendedor por email y clave
      const revendedores = dbData.revendedores;
      slugActual = Object.keys(revendedores).find(slug => {
        const r = revendedores[slug];
        return r.email === email && r.password === pass;
      });

      if (slugActual) {
        revendedorActual = revendedores[slugActual];

        if (revendedorActual.activo === false) {
          alert('Tu suscripción está inactiva o suspendida. Contacta al administrador.');
          return;
        }

        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');

        cargarDatosDashboard();
      } else {
        alert('Correo o contraseña incorrectos.');
      }
    }

    function cargarDatosDashboard() {
      if (!dbData.tiendas) dbData.tiendas = {};
      if (!dbData.tiendas[slugActual]) {
        dbData.tiendas[slugActual] = {
          nombre: revendedorActual.nombre || slugActual,
          whatsapp: "593999999999",
          productos: []
        };
      }

      const tienda = dbData.tiendas[slugActual];
      document.getElementById('titulo-tienda').innerText = tienda.nombre || slugActual;
      document.getElementById('conf-nombre').value = tienda.nombre || '';
      document.getElementById('conf-whatsapp').value = tienda.whatsapp || '';

      const link = window.location.origin + '/?tienda=' + slugActual;
      const elLink = document.getElementById('link-publico');
      elLink.href = link;
      elLink.innerText = link;

      renderProductos();
    }

    function renderProductos() {
      const lista = document.getElementById('lista-productos');
      lista.innerHTML = '';
      const productos = dbData.tiendas[slugActual].productos || [];

      if (productos.length === 0) {
        lista.innerHTML = '<p style="color:#64748b; font-size:14px;">No tienes productos cargados aún.</p>';
        return;
      }

      productos.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = 'producto-item';
        item.innerHTML = `
          <div>
            <strong>${p.nombre}</strong> - $${p.precio}<br>
            <small style="color:#94a3b8;">${p.descripcion || ''}</small>
          </div>
          <button onclick="eliminarProducto(${idx})" style="width:auto; padding:6px 10px; background:#ef4444; color:#fff; font-size:12px;">X</button>
        `;
        lista.appendChild(item);
      });
    }

    async function guardarAjustes() {
      const nuevoNombre = document.getElementById('conf-nombre').value.trim();
      const nuevoWhatsapp = document.getElementById('conf-whatsapp').value.trim();

      dbData.tiendas[slugActual].nombre = nuevoNombre;
      dbData.tiendas[slugActual].whatsapp = nuevoWhatsapp;
      dbData.revendedores[slugActual].nombre = nuevoNombre;

      await persistir();
      alert('¡Configuración guardada!');
      document.getElementById('titulo-tienda').innerText = nuevoNombre;
    }

    async function agregarProducto() {
      const nombre = document.getElementById('prod-nombre').value.trim();
      const precio = document.getElementById('prod-precio').value.trim();
      const descripcion = document.getElementById('prod-desc').value.trim();

      if (!nombre || !precio) {
        alert('Nombre y precio son obligatorios.');
        return;
      }

      if (!dbData.tiendas[slugActual].productos) {
        dbData.tiendas[slugActual].productos = [];
      }

      dbData.tiendas[slugActual].productos.push({ nombre, precio, descripcion });
      await persistir();

      document.getElementById('prod-nombre').value = '';
      document.getElementById('prod-precio').value = '';
      document.getElementById('prod-desc').value = '';
      renderProductos();
    }

    async function eliminarProducto(idx) {
      dbData.tiendas[slugActual].productos.splice(idx, 1);
      await persistir();
      renderProductos();
    }

    async function persistir() {
      await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dbData)
      });
    }

    cargarBD();
  </script>
</body>
</html>
