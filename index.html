<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Virtual</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f8fafc; margin: 0; padding: 20px 12px; }
    .container { max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #1e293b; }
    h1 { margin: 0 0 8px 0; font-size: 26px; color: #38bdf8; }
    .tagline { color: #94a3b8; font-size: 14px; margin: 0; }
    .grid { display: grid; gap: 14px; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 18px; font-weight: bold; margin: 0 0 6px 0; color: #fff; }
    .card-desc { font-size: 13px; color: #94a3b8; margin: 0 0 12px 0; line-height: 1.4; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .precio { font-size: 20px; font-weight: 800; color: #22c55e; }
    .btn-buy { background-color: #25d366; color: #000; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
    .empty-state { text-align: center; padding: 40px 20px; color: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="tienda-nombre">Cargando catálogo...</h1>
      <p class="tagline">Selecciona tu cuenta o servicio preferido</p>
    </header>

    <div id="contenedor-productos" class="grid"></div>
  </div>

  <script>
    async function iniciarCatalogo() {
      const urlParams = new URLSearchParams(window.location.search);
      let tiendaSlug = urlParams.get('tienda');

      try {
        const res = await fetch('/api/db');
        if (!res.ok) throw new Error('No se pudo conectar a la API');
        const db = await res.json();

        // Si no viene parámetro de tienda, toma la primera disponible o fullmovies
        if (!tiendaSlug || !db.tiendas || !db.tiendas[tiendaSlug]) {
          const tiendasDisponibles = Object.keys(db.tiendas || {});
          tiendaSlug = tiendasDisponibles.length > 0 ? tiendasDisponibles[0] : 'fullmovies';
        }

        const tienda = (db.tiendas && db.tiendas[tiendaSlug]) ? db.tiendas[tiendaSlug] : null;

        if (!tienda) {
          document.getElementById('tienda-nombre').innerText = 'Tienda no encontrada';
          document.getElementById('contenedor-productos').innerHTML = '<div class="empty-state">Esta tienda aún no ha sido configurada.</div>';
          return;
        }

        document.getElementById('tienda-nombre').innerText = tienda.nombre || 'Catálogo Virtual';
        document.title = (tienda.nombre || 'Catálogo') + ' | Catálogo Virtual';

        const productos = tienda.productos || [];
        const contenedor = document.getElementById('contenedor-productos');

        if (productos.length === 0) {
          contenedor.innerHTML = '<div class="empty-state">No hay productos disponibles por el momento.</div>';
          return;
        }

        const wsNumero = tienda.whatsapp ? tienda.whatsapp.replace(/\D/g, '') : '';

        contenedor.innerHTML = productos.map(p => {
          const textoWs = encodeURIComponent(`¡Hola! Deseo adquirir el producto: ${p.nombre} ($${p.precio})`);
          const linkWs = wsNumero ? `https://wa.me/${wsNumero}?text=${textoWs}` : '#';

          return `
            <div class="card">
              <div>
                <div class="card-title">${p.nombre}</div>
                <div class="card-desc">${p.descripcion || 'Entrega inmediata y soporte garantizado.'}</div>
              </div>
              <div class="card-footer">
                <div class="precio">$${p.precio}</div>
                <a href="${linkWs}" target="_blank" class="btn-buy">Pedir por WhatsApp</a>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        document.getElementById('tienda-nombre').innerText = 'Error al cargar';
        document.getElementById('contenedor-productos').innerHTML = `<div class="empty-state" style="color:#ef4444;">Error conectando al servidor: ${err.message}</div>`;
      }
    }

    iniciarCatalogo();
  </script>
</body>
</html>
