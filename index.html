<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Virtual</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #22c55e;
      --secondary-color: #38bdf8;
      --bg-color: #07090e;
    }
    * { box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
    body {
      background-color: var(--bg-color);
      color: #f8fafc;
      margin: 0;
      padding: 16px 12px;
      min-height: 100vh;
    }
    .container { max-width: 620px; margin: 0 auto; padding-bottom: 40px; }
    header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo-tienda {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px auto;
      display: block;
      border: 2px solid var(--primary-color);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.25);
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 24px;
      font-family: 'Orbitron', sans-serif;
      color: var(--secondary-color);
      letter-spacing: 0.5px;
    }
    .tagline { color: #94a3b8; font-size: 14px; margin: 0; }
    .grid { display: grid; gap: 16px; }
    .card {
      background: #0f1626;
      border-radius: 14px;
      padding: 15px;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: border-color 0.2s;
    }
    .card-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .card-img {
      width: 85px;
      height: 85px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #334155;
    }
    .card-info { flex: 1; }
    .card-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #94a3b8; line-height: 1.3; margin-bottom: 6px; }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
    }
    .precio { font-size: 22px; font-weight: 800; color: var(--primary-color); font-family: 'Orbitron', sans-serif; }
    .btn-comprar-ahora {
      background: var(--primary-color);
      color: #031e0c;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 14px;
      border: none;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      transition: 0.2s;
    }
    .btn-comprar-ahora:active { transform: scale(0.98); }

    /* SECCIÓN DESPLEGABLE DE PAGO DENTRO DEL CATÁLOGO */
    .drawer-pago {
      background: #080d1a;
      border: 1px solid var(--primary-color);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .titulo-pago {
      font-size: 14px;
      font-weight: bold;
      color: var(--secondary-color);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .box-metodos {
      background: #0f1626;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #cbd5e1;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .btn-ws-pago {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      margin-top: 10px;
      font-family: 'Orbitron', sans-serif;
    }
    .btn-ya-pague {
      background: #22c55e;
      color: #031e0c;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
    }
    .btn-mas-info {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img id="header-logo" class="logo-tienda hidden" src="" alt="Logo">
      <h1 id="tienda-nombre">Cargando catálogo...</h1>
      <p class="tagline">Selecciona tu servicio y adquiere con entrega inmediata</p>
    </header>

    <div id="contenedor-productos" class="grid"></div>
  </div>

  <script>
    let tiendaActiva = null;
    let cardAbiertaIdx = null;

    async function iniciarCatalogo() {
      const urlParams = new URLSearchParams(window.location.search);
      let tiendaSlug = urlParams.get('tienda');

      try {
        const res = await fetch('/api/db');
        const db = await res.json();

        if (!tiendaSlug || !db.tiendas || !db.tiendas[tiendaSlug]) {
          const slugs = Object.keys(db.tiendas || {});
          tiendaSlug = slugs.length > 0 ? slugs[0] : 'fullmovies';
        }

        tiendaActiva = (db.tiendas && db.tiendas[tiendaSlug]) ? db.tiendas[tiendaSlug] : null;

        if (!tiendaActiva) {
          document.getElementById('tienda-nombre').innerText = 'Tienda no encontrada';
          return;
        }

        // Aplicar Colores
        if (tiendaActiva.tema) {
          document.documentElement.style.setProperty('--primary-color', tiendaActiva.tema.primary || '#22c55e');
          document.documentElement.style.setProperty('--secondary-color', tiendaActiva.tema.secondary || '#38bdf8');
          document.documentElement.style.setProperty('--bg-color', tiendaActiva.tema.bg || '#07090e');
        }

        // Título y Logo
        document.getElementById('tienda-nombre').innerText = tiendaActiva.nombre || 'Catálogo Virtual';
        document.title = (tiendaActiva.nombre || 'Catálogo') + ' | FULL MOVIES EC';

        if (tiendaActiva.logo) {
          const logoEl = document.getElementById('header-logo');
          logoEl.src = tiendaActiva.logo;
          logoEl.classList.remove('hidden');
        }

        renderProductos();

      } catch (e) {
        document.getElementById('tienda-nombre').innerText = 'Error al conectar con la tienda';
      }
    }

    function renderProductos() {
      const productos = tiendaActiva.productos || [];
      const contenedor = document.getElementById('contenedor-productos');

      if (productos.length === 0) {
        contenedor.innerHTML = '<p style="text-align:center; color:#64748b;">No hay servicios disponibles por el momento.</p>';
        return;
      }

      const wsNum = tiendaActiva.whatsapp ? tiendaActiva.whatsapp.replace(/\D/g, '') : '';
      const metodos = tiendaActiva.metodosPago || 'Comunícate por WhatsApp para recibir los números de cuenta bancaria disponibles.';

      contenedor.innerHTML = productos.map((p, idx) => {
        const estaAbierto = (cardAbiertaIdx === idx);

        const textoPague = encodeURIComponent(`¡Hola! Ya realicé el pago de mi servicio: *${p.nombre}* ($${p.precio}). Aquí adjunto mi comprobante para la entrega inmediata.`);
        const textoInfo = encodeURIComponent(`¡Hola! Quisiera más información sobre el servicio: *${p.nombre}* ($${p.precio}). ¿Me podrían brindar detalles?`);

        return `
          <div class="card" style="${estaAbierto ? 'border-color: var(--primary-color);' : ''}">
            <div class="card-top">
              <img src="${p.img || 'https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=200'}" class="card-img" onerror="this.src='https://via.placeholder.com/85'">
              <div class="card-info">
                <div class="card-title">${p.nombre}</div>
                <div class="card-desc">${p.descripcion || 'Garantía y activación inmediata.'}</div>
              </div>
            </div>

            <div class="card-bottom">
              <div class="precio">$${p.precio}</div>
              <button class="btn-comprar-ahora" onclick="togglePago(${idx})">
                ${estaAbierto ? '▲ OCULTAR' : '💳 COMPRAR AHORA'}
              </button>
            </div>

            <!-- ZONA DE MÉTODOS DE PAGO Y BOTONES DE WHATSAPP DIRECTOS -->
            <div id="pago-box-${idx}" class="drawer-pago ${estaAbierto ? '' : 'hidden'}">
              <div class="titulo-pago">
                <span>💳 MÉTODOS DE PAGO DISPONIBLES:</span>
                <span style="font-size:12px; color:#94a3b8;">${p.nombre} ($${p.precio})</span>
              </div>
              
              <div class="box-metodos">${metodos}</div>

              <!-- BOTÓN 1: YA PAGUÉ (A WHATSAPP) -->
              <a href="https://wa.me/${wsNum}?text=${textoPague}" target="_blank" class="btn-ws-pago btn-ya-pague">
                ✅ YA PAGUÉ (ENVIAR COMPROBANTE)
              </a>

              <!-- BOTÓN 2: MÁS INFORMACIÓN (A WHATSAPP) -->
              <a href="https://wa.me/${wsNum}?text=${textoInfo}" target="_blank" class="btn-ws-pago btn-mas-info">
                💬 MÁS INFORMACIÓN
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function togglePago(idx) {
      if (cardAbiertaIdx === idx) {
        cardAbiertaIdx = null;
      } else {
        cardAbiertaIdx = idx;
      }
      renderProductos();
      if (cardAbiertaIdx !== null) {
        const el = document.getElementById(`pago-box-${idx}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    iniciarCatalogo();
  </script>
</body>
</html>
